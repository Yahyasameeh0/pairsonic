name: pairsonic
description: Helping groups securely exchange contact information.

publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localization / i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # App structure in general
  get_it: ^7.7.0
  logger: ^1.4.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  provider: ^6.1.2
  typed_data: ^1.3.2

  # UI
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.8
  syncfusion_flutter_sliders: ^28.1.38
  flutter_spinkit: ^5.2.1
  adaptive_dialog: ^2.3.0
  flutter_svg: ^2.0.10+1

  # Backend and storage
  sqflite: ^2.3.3+1
  sembast: ^3.7.4
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  sodium_libs: ^3.3.0

  # Group pairing in general
  pointycastle: ^3.9.1
  messagepack: ^0.2.1

  # PairSonic group pairing (audio)
  ggwave_flutter:
    git: 
      url: https://github.com/fput/ggwave_flutter.git
      ref: cdf3736fe3b38959350e3a452a07f0cf6f375a8b
  flutter_sound: 9.2.13
  volume_control: ^0.1.5
  convert: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  build_runner: ^2.4.11
  test: any
  flutter_lints: ^4.0.0

dependency_overrides:
  win32: ^5.5.4
  intl: ^0.20.3
  flutter_sound: 9.2.13
  logger: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/profileImages/
    - assets/grouppairing/
  generate: true

flutter_intl:
  enabled: true
